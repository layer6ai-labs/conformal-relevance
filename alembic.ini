# Alembic configuration for conformal_relevance database migrations

[alembic]
# Path to migration scripts
script_location = conformal_relevance/db/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncate hash for migrations
truncate_slug_length = 40

# Set to 'true' to run offline migrations
prepend_sys_path = .

# Timezone for migration files
# timezone = UTC

# Max length for autogenerate to use when creating constraint names
# max_length = None

# SQLAlchemy URL - override from environment via SUPABASE_DATABASE_URL
# sqlalchemy.url = driver://user:pass@localhost/dbname
sqlalchemy.url =

[post_write_hooks]
# Hooks run after writing migration files

# Run ruff formatting on generated migrations
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
